[project]
name = "fraud-detection-mlops"
version = "0.1.0"
description = "End-to-end MLOps project for credit card fraud detection."
requires-python = ">=3.11"
readme = "README.md"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
