name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Import checks
        run: |
          python -c "import api.main, src.train, dataops.ingestion, dagster_project.definitions"

      - name: Unit tests
        run: pytest tests/ -q

      - name: dbt parse
        run: dbt parse --profiles-dir . --project-dir .
        working-directory: dbt_fraud

  container-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Build container image
        run: docker build -t fraud-detection-mlops:ci .
